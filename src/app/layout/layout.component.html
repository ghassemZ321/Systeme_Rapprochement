<div class="layout">
  <aside class="sidebar">

    <div class="sidebar-brand">
      <img src="logo.png" alt="BAMIS">
      <div class="brand-text">
        <span>BAMIS

          <br>
          Système de Rapprochement
        </span>
        
      </div>
    </div>

    <nav class="sidebar-nav">

      <div class="nav-section">Principal</div>
      <a class="nav-item" routerLink="/dashboard" routerLinkActive="active">
        <i class="fas fa-chart-line nav-icon"></i> Tableau de bord
      </a>

      <div class="nav-section">Opérations</div>
      <a class="nav-item" routerLink="/import" routerLinkActive="active">
        <i class="fas fa-file-upload nav-icon"></i> Importer un fichier
      </a>
      <a class="nav-item" routerLink="/reconciliation" routerLinkActive="active" *ngIf="auth.canReconcile()">
        <i class="fas fa-exchange-alt nav-icon"></i> Rapprochement
      </a>
      <a class="nav-item" routerLink="/reports" routerLinkActive="active" *ngIf="auth.canReconcile()">
        <i class="fas fa-file-excel nav-icon"></i> Rapports Excel
      </a>

      <div class="nav-section">Analyse</div>
      <a class="nav-item" routerLink="/search" routerLinkActive="active" *ngIf="auth.canReconcile()">
        <i class="fas fa-search nav-icon"></i> Recherche
      </a>
      <a class="nav-item" routerLink="/compare" routerLinkActive="active" *ngIf="auth.canReconcile()">
        <i class="fas fa-code-branch nav-icon"></i> Comparaison
      </a>

      <ng-container *ngIf="auth.isAdmin()">
        <div class="nav-section">Administration</div>
        <a class="nav-item" routerLink="/admin/users" routerLinkActive="active">
          <i class="fas fa-users nav-icon"></i> Utilisateurs
        </a>
        <a class="nav-item" routerLink="/admin/batches" routerLinkActive="active">
          <i class="fas fa-layer-group nav-icon"></i> Gestion des Batches
        </a>
        <a class="nav-item" routerLink="/admin/config" routerLinkActive="active">
          <i class="fas fa-cog nav-icon"></i> Configuration
        </a>
        <a class="nav-item" routerLink="/admin/audit" routerLinkActive="active">
          <i class="fas fa-clipboard-list nav-icon"></i> Journal d'audit
        </a>
      </ng-container>

    </nav>

    <div class="sidebar-footer">
      <div class="sidebar-user">
        <div class="avatar">{{ auth.getInitials() }}</div>
        <div class="avatar-info">
          <div class="avatar-name">{{ auth.getFullName() }}</div>
          <div class="avatar-role">
            <span class="status-dot"></span>
            {{ auth.getRole() }}
          </div>
        </div>
      </div>
      <button class="btn-logout" (click)="logout()">
        <i class="fas fa-sign-out-alt"></i> Déconnexion
      </button>
    </div>

  </aside>

  <div class="main-content">
    <router-outlet></router-outlet>
  </div>
</div>
