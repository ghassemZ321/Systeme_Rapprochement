<div class="change-pwd-page">
  <div class="change-pwd-card">
    <div class="card-header">
      <i class="fas fa-key"></i>
      <h2>Changer le mot de passe</h2>
      <p>Choisissez un nouveau mot de passe sécurisé</p>
    </div>

    <div *ngIf="error" class="alert alert-error">
      <i class="fas fa-exclamation-circle"></i> {{ error }}
    </div>
    <div *ngIf="success" class="alert alert-success">
      <i class="fas fa-check-circle"></i> {{ success }}
    </div>

    <form (ngSubmit)="onSubmit()">
      <div class="form-group">
        <label>Ancien mot de passe</label>
        <input type="password" [(ngModel)]="oldPassword" name="oldPassword"
          placeholder="Votre mot de passe actuel" class="form-input" [disabled]="loading" />
      </div>
      <div class="form-group">
        <label>Nouveau mot de passe</label>
        <input type="password" [(ngModel)]="newPassword" name="newPassword"
          placeholder="Minimum 8 caractères" class="form-input" [disabled]="loading" />
      </div>
      <div class="form-group">
        <label>Confirmer le nouveau mot de passe</label>
        <input type="password" [(ngModel)]="confirmPassword" name="confirmPassword"
          placeholder="Répétez le nouveau mot de passe" class="form-input" [disabled]="loading" />
      </div>
      <button type="submit" class="btn-submit" [disabled]="loading">
        <i class="fas"
          [class.fa-save]="!loading"
          [class.fa-spinner]="loading"
          [class.fa-spin]="loading"></i>
        {{ loading ? 'Modification...' : 'Modifier le mot de passe' }}
      </button>
    </form>
  </div>
</div>
