<div class="audit">
  <div class="page-header">
    <h2><i class="fas fa-clipboard-list"></i> Journal d'audit</h2>
    
  </div>

  <div *ngIf="error" class="alert alert-error"><i class="fas fa-exclamation-circle"></i> {{ error }}</div>

  <!-- Filtres -->
  <div class="section-card filters-card">
    <div class="filters-row">
      <div class="filter-group">
        <label><i class="fas fa-search"></i> Rechercher</label>
        <input type="text" [(ngModel)]="searchTerm" (ngModelChange)="filter()"
          placeholder="Utilisateur, détails..." class="form-input" />
      </div>
      <div class="filter-group">
        <label><i class="fas fa-filter"></i> Action</label>
        <select [(ngModel)]="selectedAction" (ngModelChange)="filter()" class="form-select">
          <option value="">Toutes les actions</option>
          <option *ngFor="let a of actions" [value]="a">{{ a }}</option>
        </select>
      </div>
      <button class="btn-clear" (click)="clearFilters()" *ngIf="searchTerm || selectedAction">
        <i class="fas fa-times"></i> Effacer
      </button>
    </div>
  </div>

  <!-- Table des logs -->
  <div class="section-card">
    <h3>
      <i class="fas fa-list"></i>
      Événements ({{ filteredLogs.length }})
    </h3>

    <div *ngIf="loading" class="loading-spinner">
      <i class="fas fa-spinner fa-spin"></i> Chargement...
    </div>

    <div *ngIf="!loading && filteredLogs.length === 0" class="empty-state">
      <i class="fas fa-clipboard"></i>
      <p>Aucun événement trouvé.</p>
    </div>

    <table *ngIf="!loading && filteredLogs.length > 0" class="data-table">
      <thead>
        <tr>
          <th>Date</th>
          <th>Utilisateur</th>
          <th>Action</th>
          <th>Détails</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let log of filteredLogs">
          <td class="date-cell">{{ formatDate(log.createdAt) }}</td>
          <td><strong>{{ log.username }}</strong></td>
          <td><span [class]="getActionBadge(log.action)">{{ log.action }}</span></td>
          <td class="details-cell">{{ log.details || '-' }}</td>
        </tr>
      </tbody>
    </table>
  </div>
</div>
