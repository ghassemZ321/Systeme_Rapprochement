<div class="config">
  <div class="page-header">
    <h2><i class="fas fa-cog"></i> Configuration système</h2>
    
  </div>

  <div *ngIf="error" class="alert alert-error"><i class="fas fa-exclamation-circle"></i> {{ error }}</div>
  <div *ngIf="success" class="alert alert-success"><i class="fas fa-check-circle"></i> {{ success }}</div>

  <div class="section-card">
    <h3><i class="fas fa-sliders-h"></i> Paramètres</h3>

    <div *ngIf="loading" class="loading-spinner">
      <i class="fas fa-spinner fa-spin"></i> Chargement...
    </div>

    <div *ngIf="!loading && configs.length === 0" class="empty-state">
      <i class="fas fa-cog"></i>
      <p>Aucun paramètre configuré.</p>
    </div>

    <div *ngIf="!loading && configs.length > 0" class="config-list">
      <div class="config-item" *ngFor="let cfg of configs">
        <div class="config-info">
          <span class="config-key">{{ cfg.configKey }}</span>
          <span class="config-desc" *ngIf="cfg.description">{{ cfg.description }}</span>
        </div>
        <div class="config-edit">
          <input type="text"
            [(ngModel)]="editValues[cfg.configKey]"
            class="form-input"
            [placeholder]="cfg.configValue" />
          <button class="btn-save"
            (click)="saveConfig(cfg)"
            [disabled]="saving === cfg.configKey || !hasChanged(cfg)">
            <i class="fas" [class.fa-save]="saving !== cfg.configKey" [class.fa-spinner]="saving === cfg.configKey" [class.fa-spin]="saving === cfg.configKey"></i>
            {{ saving === cfg.configKey ? 'Sauvegarde...' : 'Sauvegarder' }}
          </button>
        </div>
      </div>
    </div>
  </div>
</div>
