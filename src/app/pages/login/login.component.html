<div class="login-page">
  <div class="login-box">

    <!-- Logo -->
    <div class="login-logo">
      <img src="logo.png" alt="logo-bamis">
      <h1>BAMIS</h1>
      <p>Système de Rapprochement Bancaire</p>
    </div>

    <!-- Formulaire -->
    <form (ngSubmit)="onLogin()" class="login-form">

      <div class="field">
        <label>Identifiant</label>
        <div class="input-wrap">
          <span class="input-icon"><i class="fas fa-user"></i></span>
          <input
            type="text"
            [(ngModel)]="username"
            name="username"
            placeholder="Votre identifiant"
            autocomplete="username"
            [disabled]="loading"
          />
        </div>
      </div>

      <div class="field">
        <label>Mot de passe</label>
        <div class="input-wrap">
          <span class="input-icon"><i class="fas fa-lock"></i></span>
          <input
            [type]="showPassword ? 'text' : 'password'"
            [(ngModel)]="password"
            name="password"
            placeholder="Votre mot de passe"
            autocomplete="current-password"
            [disabled]="loading"
          />
          <button type="button" class="toggle-pwd" (click)="togglePassword()">
            <i [class]="showPassword ? 'fas fa-eye-slash' : 'fas fa-eye'"></i>
          </button>
        </div>
      </div>

      <div class="alert-danger" *ngIf="error">
        <i class="fas fa-exclamation-triangle"></i> {{ error }}
      </div>

      <button type="submit" class="btn-login" [disabled]="loading">
        <span *ngIf="!loading"><i class="fas fa-sign-in-alt"></i> SE CONNECTER</span>
        <span *ngIf="loading"><i class="fas fa-spinner fa-spin"></i> Connexion...</span>
      </button>

    </form>
    <br>
    <p class="login-footer">
      <i class="fas fa-shield-alt"></i>© 2026 BAMIS — Espace professionnel sécurisé
    </p>

  </div>
</div>
